version: '3.7'

services:
  backend:
    image: ghcr.io/alvarohc777/radowski.backend:v2.0
    container_name: backend
    command: gunicorn -b 0.0.0.0:8000 radowski.wsgi
    volumes:
      - static_volume:/static
    ports:
      - 8000:8000
    environment:
      - is_prod=
      - POSTGRES_NAME=
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
      - POSTGRES_HOST=
      - POSTGRES_PORT=
      - SECRET_KEY=
      - ALLOWED_HOSTS=
      - CORS_ALLOWED_ORIGINS=

  proxy:
    image: ghcr.io/alvarohc777/radowski.proxy:v0.1
    container_name: proxy
    volumes:
      - static_volume:/static
    ports:
      - "80:80"

volumes:
  static_volume:


